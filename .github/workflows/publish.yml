# Runs the tests on every push to main, then publishes the app image to
# ghcr.io/quix-cafe/food.db (amd64 + arm64). docker-compose.yml pulls that image, so
# tugtainer (or `docker compose pull`) can see and apply new versions.
name: Test and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kitchen
          POSTGRES_PASSWORD: kitchen
          POSTGRES_DB: kitchen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kitchen -d kitchen_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://kitchen:kitchen@localhost:5432/kitchen_test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/quix-cafe/food.db:latest
            ghcr.io/quix-cafe/food.db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
