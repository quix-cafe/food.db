services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 3s
      retries: 20

  app:
    # Published by .github/workflows/publish.yml on every push to main. Pulling it (rather
    # than building here) lets tugtainer or `docker compose pull` see new versions.
    image: ghcr.io/quix-cafe/food.db:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kitchen:kitchen@db:5432/kitchen
      PORT: 3000
      UPLOAD_DIR: /app/data/uploads
      BACKUP_DIR: /app/data/backups
    volumes:
      - uploads:/app/data/uploads
      - backups:/app/data/backups
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
  backups:
